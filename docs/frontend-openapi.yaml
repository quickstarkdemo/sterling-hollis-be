  /api/demo/observability:
    get:
      tags: [demo]
      summary: Get Clerk demo observability state
      description: >
        Clerk-authenticated demo-panel endpoint for reading Datadog fault
        harness state. Caller must be allowlisted by email or Clerk subject.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
    post:
      tags: [demo]
      summary: Update Clerk demo observability state
      description: >
        Clerk-authenticated demo-panel endpoint for enabling latency, degraded
        supplier-feed errors, or controlled network outage simulation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoObservabilityUpdateRequest"
            examples:
              network_outage:
                summary: Enable controlled network outage demo
                value:
                  enabled: true
                  mode: network_outage
                  network_event_count: 3
              latency:
                summary: Enable latency demo
                value:
                  enabled: true
                  mode: latency
                  latency_seconds: 8
                  target_store_id: "1001"
                  network_event_count: 3
      responses:
        "200":
          description: Updated demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
        "422":
          description: Invalid request shape.
  /api/demo/observability/network-outage-log:
    post:
      tags: [demo]
      summary: Send Clerk demo network outage SNMP logs
      description: >
        Clerk-authenticated demo-panel endpoint that sends the configured
        SNMP-trap-shaped network outage log events to Datadog Logs HTTP Intake
        using the backend DD_API_KEY.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datadog Logs intake accepted the SNMP-shaped demo logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityLogSendResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
        "502":
          description: Datadog Logs intake rejected the payload or DD_API_KEY is missing.
  /api/demo/observability/reset:
    post:
      tags: [demo]
      summary: Reset Clerk demo observability state
      description: Clerk-authenticated reset endpoint that remains available during network outage demos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disabled demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
  /admin/product-images/generate:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin, images]
      summary: Enqueue product image generation
      description: >
        Admin/operations endpoint. Starts a background job processed by the
        worker. Do not expose this as an unauthenticated shopper-facing action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationJobRequest"
      responses:
        "200":
          description: Queued image generation job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobResponse"
  /admin/product-images/jobs:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin, images]
      summary: List image generation jobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent image generation jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobListResponse"
  /admin/product-images/jobs/{job_id}:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin, images]
      summary: Get image generation job
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image generation job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobResponse"
        "404":
          description: Job not found.
  /admin/demo/observability:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin]
      summary: Get demo observability state
      description: Operator/demo endpoint for reading the Datadog fault harness state.
      responses:
        "200":
          description: Current demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
    post:
      tags: [admin]
      summary: Update demo observability state
      description: >
        Operator/demo endpoint for enabling latency or error injection in the
        backend chat path. This should not be exposed as a public shopper control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoObservabilityUpdateRequest"
            examples:
              latency:
                summary: Enable latency demo
                value:
                  enabled: true
                  mode: latency
                  latency_seconds: 8
                  target_store_id: "1001"
              off:
                summary: Disable demo harness
                value:
                  enabled: false
                  mode: off
              network_outage:
                summary: Enable controlled network outage demo
                value:
                  enabled: true
                  mode: network_outage
                  network_event_count: 3
      responses:
        "200":
          description: Updated demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "422":
          description: Invalid request shape.
  /admin/demo/observability/reset:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Reset demo observability state
      description: Disables the Datadog demo fault harness and returns mode to off.
      responses:
        "200":
          description: Disabled demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
  /admin/demo/observability/network-outage-log:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Send demo network outage SNMP log
      description: >
        Sends the configured SNMP-trap-shaped network outage log events to
        Datadog Logs HTTP Intake using the backend DD_API_KEY. Call this before
        enabling network_outage mode.
      responses:
        "200":
          description: Datadog Logs intake accepted the SNMP-shaped demo log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityLogSendResponse"
        "502":
          description: Datadog Logs intake rejected the payload or DD_API_KEY is missing.
  /admin/demo/observability/trigger-error:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Trigger unhandled demo supplier feed error
      description: >
        Explicitly raises the fictitious supplier-feed schema exception for
        Datadog Error Management demos. This endpoint intentionally returns 500;
        normal chat requests should not be used to trigger unhandled failures.
      responses:
        "500":
          description: Intentional DemoSupplierFeedSchemaError.
  /health:
    get:
      tags: [admin]
      summary: Health check
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for safe mutation retries; reuse requires an identical request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: string
    StoreIdQuery:
      name: store_id
      in: query
      schema:
        type: string
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
    SearchQueryRequired:
      name: q
      in: query
      required: true
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    Brand:
      name: brand
      in: query
      schema:
        type: string
    Color:
      name: color
      in: query
      schema:
        type: string
    Size:
      name: size
      in: query
      schema:
        type: string
    Availability:
      name: availability
      in: query
      schema:
        type: string
    MinPrice:
      name: min_price
      in: query
      schema:
        type: number
        minimum: 0
    MaxPrice:
      name: max_price
      in: query
      schema:
        type: number
        minimum: 0
    IncludePreorder:
      name: include_preorder
      in: query
      schema:
        type: boolean
        default: true
    InStockOnly:
      name: in_stock_only
      in: query
      schema:
        type: boolean
        default: false
    Sort:
      name: sort
      in: query
      schema:
        $ref: "#/components/schemas/ProductSort"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    RelatedLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    AdminLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    CapabilityStatus:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [feature_disabled, missing_api_key, missing_safety_secret]
    CatalogStudioCapabilities:
      type: object
      additionalProperties: false
      required: [responses, moderation, image_generation, realtime, worker_storage, catalog]
      properties:
        responses:
          $ref: "#/components/schemas/CapabilityStatus"
        moderation:
          $ref: "#/components/schemas/CapabilityStatus"
        image_generation:
          $ref: "#/components/schemas/CapabilityStatus"
        realtime:
          $ref: "#/components/schemas/CapabilityStatus"
        worker_storage:
          $ref: "#/components/schemas/CapabilityStatus"
        catalog:
          $ref: "#/components/schemas/CapabilityStatus"
    CatalogStudioSessionResponse:
      type: object
      additionalProperties: false
      required: [authorized, capabilities]
      properties:
        authorized:
          type: boolean
          enum: [true]
        capabilities:
          $ref: "#/components/schemas/CatalogStudioCapabilities"
    CatalogInventoryDraft:
      type: object
      additionalProperties: false
      required: [store_id, availability, inventory_qty]
      properties:
        store_id: {type: string}
        size: {type: string, default: One Size}
        availability: {type: string}
        inventory_qty: {type: integer, minimum: 0}
        objective_weight: {type: number, minimum: 0, maximum: 1, default: 0}
        metadata: {type: object, additionalProperties: true, default: {}}
    CatalogVariantDraft:
      type: object
      additionalProperties: false
      required: [price_min, price_max, inventory]
      properties:
        variant_id: {type: string, nullable: true}
        color: {type: string, nullable: true}
        material: {type: string, nullable: true}
        gender: {type: string, nullable: true}
        season: {type: string, nullable: true}
        price_min: {type: number, minimum: 0}
        price_max: {type: number, minimum: 0}
        link: {type: string, nullable: true}
        image_link: {type: string, nullable: true}
        image_set: {type: object, additionalProperties: true, default: {}}
        metadata: {type: object, additionalProperties: true, default: {}}
        inventory:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CatalogInventoryDraft"
    CatalogDesignSpecification:
      type: object
      additionalProperties: false
      required: [product_type, silhouette, construction, distinguishing_features]
      properties:
        product_type: {type: string, minLength: 1, maxLength: 128}
        silhouette: {type: string, minLength: 1, maxLength: 255}
        construction: {type: string, minLength: 1, maxLength: 500}
        distinguishing_features:
          type: array
          maxItems: 8
          items: {type: string, minLength: 1}
    ProductMediaDraft:
      type: object
      additionalProperties: false
      required: [media_id, role, intent, parameters, image_set, approval_status, display_order, provenance]
      properties:
        media_id: {type: string, minLength: 1, maxLength: 64}
        role: {type: string, enum: [core, variation]}
        intent: {type: string, enum: [manual, color, angle, scene, scale, people, freeform]}
        source_media_id: {type: string, nullable: true, maxLength: 64}
        parameters: {type: object, additionalProperties: true}
        image_set: {type: object, additionalProperties: true}
        approval_status: {type: string, enum: [pending, approved, rejected]}
        display_order: {type: integer, minimum: 0}
        provenance: {type: object, additionalProperties: true}
    CatalogProductDraft:
      type: object
      additionalProperties: false
      required: [seed_run_id, title, description, brand, category, variants]
      properties:
        product_id: {type: string, nullable: true}
        seed_run_id: {type: string}
        title: {type: string}
        description: {type: string}
        brand: {type: string}
        category: {type: string}
        metadata: {type: object, additionalProperties: true, default: {}}
        design_specification:
          allOf:
            - $ref: "#/components/schemas/CatalogDesignSpecification"
          nullable: true
        variant_axes:
          type: array
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [color, material]}
          default: []
        primary_variant_index: {type: integer, minimum: 0, default: 0}
        media:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/ProductMediaDraft"
          default: []
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CatalogVariantDraft"
    ProductInventoryDraftV2:
      type: object
      additionalProperties: false
      required: [store_id, availability, inventory_qty]
      properties:
        store_id: {type: string, minLength: 1, maxLength: 64}
        size: {type: string, nullable: true, maxLength: 64}
        availability: {type: string, minLength: 1, maxLength: 32}
        inventory_qty: {type: integer, minimum: 0}
        metadata: {type: object, additionalProperties: true, default: {}}
    CatalogProductDraftV2:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - seed_run_id
        - title
        - description
        - brand
        - category
        - price_min
        - price_max
        - media
        - inventory
      properties:
        schema_version: {type: integer, enum: [2], default: 2}
        product_id: {type: string, nullable: true, maxLength: 64}
        seed_run_id: {type: string, minLength: 1, maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, minLength: 1}
        brand: {type: string, minLength: 1, maxLength: 128}
        category: {type: string, minLength: 1, maxLength: 128}
        price_min: {type: number, minimum: 0}
        price_max: {type: number, minimum: 0}
        link: {type: string, nullable: true, maxLength: 500}
        color: {type: string, nullable: true, maxLength: 64}
        material: {type: string, nullable: true, maxLength: 64}
        gender: {type: string, nullable: true, maxLength: 32}
        season: {type: string, nullable: true, maxLength: 32}
        metadata: {type: object, additionalProperties: true, default: {}}
        media:
          type: array
          maxItems: 24
          items: {$ref: "#/components/schemas/ProductMediaDraft"}
          default: []
        inventory:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ProductInventoryDraftV2"}
    DraftMutationRequestV2:
      type: object
      additionalProperties: false
      required: [expected_version, product]
      properties:
        expected_version: {type: integer, minimum: 0}
        current_draft_id: {type: string, nullable: true, maxLength: 64}
        expected_draft_version: {type: integer, nullable: true, minimum: 1}
        moderation_state:
          type: string
          enum: [pending, approved, blocked]
          default: pending
        product: {$ref: "#/components/schemas/CatalogProductDraftV2"}
    DraftMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, product]
      properties:
        expected_version: {type: integer, minimum: 0}
        current_draft_id: {type: string, nullable: true, maxLength: 64}
        expected_draft_version: {type: integer, nullable: true, minimum: 1}
        moderation_state:
          type: string
          enum: [pending, approved, blocked]
          default: pending
        product:
          $ref: "#/components/schemas/CatalogProductDraft"
    StartRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        workflow_id: {type: string, nullable: true, maxLength: 64}
    PublishRequest:
      type: object
      additionalProperties: false
      required: [draft_id, expected_version]
      properties:
        draft_id: {type: string}
        expected_version: {type: integer, minimum: 0}
    ArchiveRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 0}
    DraftRevisionResponse:
      type: object
      additionalProperties: false
      required: [id, product_id, base_version, status, moderation_state, created_by, created_at]
      properties:
        id: {type: string}
        product_id: {type: string}
        base_version: {type: integer}
        status: {type: string, enum: [draft, published]}
        moderation_state: {type: string, enum: [pending, approved, blocked]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    AdminDraftSnapshot:
      type: object
      additionalProperties: false
      required: [revision, draft_version, product]
      properties:
