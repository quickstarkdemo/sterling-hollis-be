openapi: 3.0.3
info:
  title: Product DB Retail Frontend API
  version: 0.1.0
  description: >
    Curated frontend contract for retail catalog browsing, product details,
    recommendations, generated product images, image-generation job status,
    and storefront chat.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://sterling-hollis-be.quickstark.com
    description: Production
tags:
  - name: chat
  - name: catalog
  - name: recommendations
  - name: images
  - name: admin
    description: Legacy operator routes; disabled by default in public deployments and policy-protected when enabled in production.
  - name: catalog-studio-admin
    description: Clerk-authenticated Catalog Studio administration contract.
  - name: demo
paths:
  /api/admin/session:
    get:
      tags: [catalog-studio-admin]
      summary: Resolve Catalog Studio administrator session
      description: >
        Verifies the Clerk session and server-side administrator policy, then
        returns configuration-only capability flags without probing providers
        or exposing configuration values.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized Catalog Studio session. Response is not cacheable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStudioSessionResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Valid Clerk user is not a Catalog Studio administrator.
  /api/admin/catalog/products/drafts:
    post:
      tags: [catalog-studio-admin]
      summary: Create a private catalog product draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMutationRequest"
      responses:
        "201":
          description: Private draft created, or the original result replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRevisionResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: Version or idempotency conflict.}
        "422": {description: Invalid product snapshot.}
  /api/admin/catalog/products/{product_id}/draft:
    put:
      tags: [catalog-studio-admin]
      summary: Stage a private revision of a published product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMutationRequest"
      responses:
        "201":
          description: Private revision created without changing the published snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRevisionResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: Version or idempotency conflict.}
        "422": {description: Invalid product snapshot.}
  /api/admin/catalog/products/{product_id}/publish:
    post:
      tags: [catalog-studio-admin]
      summary: Atomically publish an approved catalog draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Product, variants, and inventory published atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleMutationResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Draft not found.}
        "409": {description: Version, idempotency, moderation, or completeness conflict.}
  /api/admin/catalog/products/{product_id}/archive:
    post:
      tags: [catalog-studio-admin]
      summary: Archive a published catalog product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Product archived and removed from public reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleMutationResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Product not found.}
        "409": {description: Version or idempotency conflict.}
  /api/admin/catalog/products/{product_id}:
    get:
      tags: [catalog-studio-admin]
      summary: Inspect product lifecycle and draft history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Administrative product state, including private revision metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Product or draft history not found.}
  /api/admin/catalog/demo-runs:
    post:
      tags: [catalog-studio-admin]
      summary: Start a sanitized OpenAI demo run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRunStartRequest"
      responses:
        "201":
          description: Administrator-owned run with its initial business event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRunResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: A linked draft, image job, or product does not exist.}
  /api/admin/catalog/demo-runs/{run_id}/events:
    post:
      tags: [catalog-studio-admin]
      summary: Append a sanitized, ordered OpenAI demo event
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoEventInput"
      responses:
        "201":
          description: Sanitized event projection; exact client-event retries replay this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoEventResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Run is missing or owned by another administrator.}
        "409": {description: Conflicting client event ID or invalid linked record.}
  /api/admin/catalog/demo-runs/{run_id}/draft-commands:
    post:
      tags: [catalog-studio-admin]
      summary: Generate or refine a moderated product draft
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogAICommandRequest"
      responses:
        "200":
          description: Moderation-approved private draft, or a safe blocked result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAIWorkflowResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Run or current draft not found.}
        "409": {description: Stale draft, idempotency conflict, or command already processing.}
        "502": {description: Moderation or structured Responses output failed.}
        "503": {description: Responses or catalog context is not configured.}
        "504": {description: Responses timed out.}
  /api/admin/catalog/demo-runs/{run_id}:
    get:
      tags: [catalog-studio-admin]
      summary: Read a business or developer demo timeline
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: developer
          in: query
          description: Include sanitized developer fields; available only to the run owner.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Ordered business timeline with optional owner-only developer projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRunResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Developer view requested by a non-owner.}
        "404": {description: Run is missing or not shared with the caller.}
  /api/chat:
    post:
      tags: [chat]
      summary: Storefront chat
      description: >
        Stable retail chat endpoint for product questions, catalog search,
        related products, store contact information, approved service answers,
        and authenticated account/order/personal recommendation requests.
        Authentication is optional; sensitive requests are blocked unless the
        bearer token resolves to a linked customer.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              productQuestion:
                summary: Product page question
                value:
                  message: Is this jacket available?
                  context:
                    page_type: product
                    route: /product/cat_123
                    current_product:
                      id: cat_123
                    store_id: "1001"
              storePhone:
                summary: Open store contact question
                value:
                  message: What phone number can I call?
                  context:
                    store_id: "1001"
              orderStatus:
                summary: Authenticated order request
                value:
                  message: What is my order status?
                  context:
                    store_id: "1001"
      responses:
        "200":
          description: Chat assistant response. Sensitive requests may return route=blocked with sign-in/link actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          description: Invalid bearer token.
        "422":
          description: Invalid request shape.
  /api/catalog:
    get:
      tags: [catalog]
      summary: Catalog entry point
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Category navigation and product cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndexResponse"
  /api/categories:
    get:
      tags: [catalog]
      summary: Store-independent categories
      responses:
        "200":
          description: Available catalog categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/catalog/categories:
    get:
      tags: [catalog]
      summary: Store-independent categories alias
      responses:
        "200":
          description: Available catalog categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/stores/{store_id}/categories:
    get:
      tags: [catalog]
      summary: Store-scoped category availability
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Category counts scoped by store inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/products:
    get:
      tags: [catalog]
      summary: Product listing
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/Color"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Availability"
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/IncludePreorder"
        - $ref: "#/components/parameters/InStockOnly"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Catalog product cards with facets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /api/catalog/products:
    get:
      tags: [catalog]
      summary: Store-independent product listing alias
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Catalog product cards with facets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /api/categories/{category}/products:
    get:
      tags: [catalog]
      summary: Products in one category
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/InStockOnly"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Catalog product cards scoped to a category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /api/products/{product_id}:
    get:
      tags: [catalog]
      summary: Product detail
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/StoreIdQuery"
      responses:
        "200":
          description: Product detail with variants and inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "404":
          description: Product not found.
  /api/products/{product_id}/related:
    get:
      tags: [catalog]
      summary: Related products
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/RelatedLimit"
      responses:
        "200":
          description: Related product cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /api/search/products:
    get:
      tags: [catalog]
      summary: Product search
      parameters:
        - $ref: "#/components/parameters/SearchQueryRequired"
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /api/recommendations/products:
    post:
      tags: [recommendations]
      summary: Product recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRecommendationRequest"
      responses:
        "200":
          description: Recommended product cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRecommendationResponse"
  /api/image-analysis:
    post:
      tags: [images, recommendations]
      summary: Analyze uploaded consumer image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                context:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Structured image attributes and normalized style constraints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAnalysisResponse"
  /api/recommendations/image:
    post:
      tags: [images, recommendations]
      summary: Recommend products from uploaded consumer image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                context:
                  type: string
                  nullable: true
                store_id:
                  type: string
                  nullable: true
                category:
                  type: string
                  nullable: true
                brand:
                  type: string
                  nullable: true
                budget_min:
                  type: number
                  nullable: true
                budget_max:
                  type: number
                  nullable: true
                include_preorder:
                  type: boolean
                  default: true
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 12
      responses:
        "200":
          description: Image analysis and recommended product cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecommendationResponse"
  /api/demo/observability:
    get:
      tags: [demo]
      summary: Get Clerk demo observability state
      description: >
        Clerk-authenticated demo-panel endpoint for reading Datadog fault
        harness state. Caller must be allowlisted by email or Clerk subject.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
    post:
      tags: [demo]
      summary: Update Clerk demo observability state
      description: >
        Clerk-authenticated demo-panel endpoint for enabling latency, degraded
        supplier-feed errors, or controlled network outage simulation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoObservabilityUpdateRequest"
            examples:
              network_outage:
                summary: Enable controlled network outage demo
                value:
                  enabled: true
                  mode: network_outage
                  network_event_count: 3
              latency:
                summary: Enable latency demo
                value:
                  enabled: true
                  mode: latency
                  latency_seconds: 8
                  target_store_id: "1001"
                  network_event_count: 3
      responses:
        "200":
          description: Updated demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
        "422":
          description: Invalid request shape.
  /api/demo/observability/network-outage-log:
    post:
      tags: [demo]
      summary: Send Clerk demo network outage SNMP logs
      description: >
        Clerk-authenticated demo-panel endpoint that sends the configured
        SNMP-trap-shaped network outage log events to Datadog Logs HTTP Intake
        using the backend DD_API_KEY.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datadog Logs intake accepted the SNMP-shaped demo logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityLogSendResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
        "502":
          description: Datadog Logs intake rejected the payload or DD_API_KEY is missing.
  /api/demo/observability/reset:
    post:
      tags: [demo]
      summary: Reset Clerk demo observability state
      description: Clerk-authenticated reset endpoint that remains available during network outage demos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disabled demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Clerk user is not allowed to control demo toggles.
  /admin/product-images/generate:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin, images]
      summary: Enqueue product image generation
      description: >
        Admin/operations endpoint. Starts a background job processed by the
        worker. Do not expose this as an unauthenticated shopper-facing action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationJobRequest"
      responses:
        "200":
          description: Queued image generation job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobResponse"
  /admin/product-images/jobs:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin, images]
      summary: List image generation jobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent image generation jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobListResponse"
  /admin/product-images/jobs/{job_id}:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin, images]
      summary: Get image generation job
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image generation job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJobResponse"
        "404":
          description: Job not found.
  /admin/demo/observability:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    get:
      tags: [admin]
      summary: Get demo observability state
      description: Operator/demo endpoint for reading the Datadog fault harness state.
      responses:
        "200":
          description: Current demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
    post:
      tags: [admin]
      summary: Update demo observability state
      description: >
        Operator/demo endpoint for enabling latency or error injection in the
        backend chat path. This should not be exposed as a public shopper control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoObservabilityUpdateRequest"
            examples:
              latency:
                summary: Enable latency demo
                value:
                  enabled: true
                  mode: latency
                  latency_seconds: 8
                  target_store_id: "1001"
              off:
                summary: Disable demo harness
                value:
                  enabled: false
                  mode: off
              network_outage:
                summary: Enable controlled network outage demo
                value:
                  enabled: true
                  mode: network_outage
                  network_event_count: 3
      responses:
        "200":
          description: Updated demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
        "422":
          description: Invalid request shape.
  /admin/demo/observability/reset:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Reset demo observability state
      description: Disables the Datadog demo fault harness and returns mode to off.
      responses:
        "200":
          description: Disabled demo observability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityStateResponse"
  /admin/demo/observability/network-outage-log:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Send demo network outage SNMP log
      description: >
        Sends the configured SNMP-trap-shaped network outage log events to
        Datadog Logs HTTP Intake using the backend DD_API_KEY. Call this before
        enabling network_outage mode.
      responses:
        "200":
          description: Datadog Logs intake accepted the SNMP-shaped demo log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoObservabilityLogSendResponse"
        "502":
          description: Datadog Logs intake rejected the payload or DD_API_KEY is missing.
  /admin/demo/observability/trigger-error:
    x-admin-only: true
    x-access-control: external-admin-boundary-required
    post:
      tags: [admin]
      summary: Trigger unhandled demo supplier feed error
      description: >
        Explicitly raises the fictitious supplier-feed schema exception for
        Datadog Error Management demos. This endpoint intentionally returns 500;
        normal chat requests should not be used to trigger unhandled failures.
      responses:
        "500":
          description: Intentional DemoSupplierFeedSchemaError.
  /health:
    get:
      tags: [admin]
      summary: Health check
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
components:
