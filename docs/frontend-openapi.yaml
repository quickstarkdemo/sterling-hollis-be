        type: string
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
    SearchQueryRequired:
      name: q
      in: query
      required: true
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    Brand:
      name: brand
      in: query
      schema:
        type: string
    Color:
      name: color
      in: query
      schema:
        type: string
    Size:
      name: size
      in: query
      schema:
        type: string
    Availability:
      name: availability
      in: query
      schema:
        type: string
    MinPrice:
      name: min_price
      in: query
      schema:
        type: number
        minimum: 0
    MaxPrice:
      name: max_price
      in: query
