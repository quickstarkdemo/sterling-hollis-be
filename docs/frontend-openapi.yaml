openapi: 3.0.3
info:
  title: Product DB Retail Frontend API
  version: 0.1.0
  description: >
    Curated frontend contract for retail catalog browsing, product details,
    recommendations, generated product images, image-generation job status,
    and storefront chat.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://sterling-hollis-be.quickstark.com
    description: Production
tags:
  - name: chat
  - name: catalog
  - name: recommendations
  - name: images
  - name: admin
    description: Legacy operator routes; disabled by default in public deployments and policy-protected when enabled in production.
  - name: catalog-studio-admin
    description: Clerk-authenticated Catalog Studio administration contract.
  - name: demo
paths:
  /api/admin/session:
    get:
      tags: [catalog-studio-admin]
      summary: Resolve Catalog Studio administrator session
      description: >
        Verifies the Clerk session and server-side administrator policy, then
        returns configuration-only capability flags without probing providers
        or exposing configuration values.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized Catalog Studio session. Response is not cacheable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStudioSessionResponse"
        "401":
          description: Missing or invalid Clerk token.
        "403":
          description: Valid Clerk user is not a Catalog Studio administrator.
  /api/admin/catalog/products:
    get:
      tags: [catalog-studio-admin]
      summary: Search products across administrative lifecycle states
      security:
        - bearerAuth: []
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 255}}
        - name: lifecycle_status
          in: query
          schema: {type: string, enum: [draft, published, archived]}
        - {name: category, in: query, schema: {type: string, maxLength: 128}}
        - {name: brand, in: query, schema: {type: string, maxLength: 128}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
      responses:
        "200":
          description: Paginated administrative catalog results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
  /api/admin/catalog/products/drafts:
    post:
      tags: [catalog-studio-admin]
      summary: Create a private catalog product draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMutationRequest"
      responses:
        "201":
          description: Private draft created, or the original result replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRevisionResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: Version or idempotency conflict.}
        "422": {description: Invalid product snapshot.}
  /api/admin/catalog/products/{product_id}/draft:
    put:
      tags: [catalog-studio-admin]
      summary: Stage a private revision of a published product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMutationRequest"
      responses:
        "201":
          description: Private revision created without changing the published snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRevisionResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: Version or idempotency conflict.}
        "422": {description: Invalid product snapshot.}
  /api/admin/catalog/products/{product_id}/revisions:
    post:
      tags: [catalog-studio-admin]
      summary: Start a private revision from the current published snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRevisionRequest"
      responses:
        "201":
          description: Complete private snapshot, optionally linked to a workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftSnapshot"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Product or owned workflow not found.}
        "409": {description: Version, workflow, or idempotency conflict.}
  /api/admin/catalog/products/{product_id}/publish:
    post:
      tags: [catalog-studio-admin]
      summary: Atomically publish an approved catalog draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Product, variants, and inventory published atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleMutationResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Draft not found.}
        "409": {description: Version, idempotency, moderation, or completeness conflict.}
  /api/admin/catalog/products/{product_id}/archive:
    post:
      tags: [catalog-studio-admin]
      summary: Archive a published catalog product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Product archived and removed from public reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleMutationResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Product not found.}
        "409": {description: Version or idempotency conflict.}
  /api/admin/catalog/products/{product_id}:
    get:
      tags: [catalog-studio-admin]
      summary: Inspect product lifecycle and draft history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Administrative product state, including private revision metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Product or draft history not found.}
  /api/admin/catalog/v2/products:
    get:
      tags: [catalog-studio-admin]
      summary: Search canonical products across lifecycle states
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Paginated canonical product results.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminProductListResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
  /api/admin/catalog/v2/products/drafts:
    post:
      tags: [catalog-studio-admin]
      summary: Create a canonical product-level catalog draft
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DraftMutationRequestV2"}
      responses:
        "201":
          description: Private canonical draft created or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftRevisionResponse"}
        "409": {description: Version or idempotency conflict.}
        "422": {description: Invalid canonical product snapshot.}
  /api/admin/catalog/v2/products/{product_id}:
    get:
      tags: [catalog-studio-admin]
      summary: Inspect canonical product-level authoring state
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ProductId"}]
      responses:
        "200":
          description: Canonical published and private product state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminProductResponseV2"}
        "404": {description: Product or draft history not found.}
  /api/admin/catalog/v2/products/{product_id}/draft:
    put:
      tags: [catalog-studio-admin]
      summary: Stage a canonical product-level revision
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DraftMutationRequestV2"}
      responses:
        "201":
          description: Private canonical revision created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftRevisionResponse"}
        "409": {description: Published version, draft version, or idempotency conflict.}
        "422": {description: Invalid canonical product snapshot.}
  /api/admin/catalog/v2/products/{product_id}/revisions:
    post:
      tags: [catalog-studio-admin]
      summary: Start a canonical revision from published state
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartRevisionRequest"}
      responses:
        "201":
          description: Complete private canonical snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminDraftSnapshotV2"}
        "404": {description: Product not found.}
        "409": {description: Version or idempotency conflict.}
  /api/admin/catalog/v2/products/{product_id}/publish:
    post:
      tags: [catalog-studio-admin]
      summary: Publish a canonical product-level draft
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublishRequest"}
      responses:
        "200":
          description: Product fields, media, and inventory published atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LifecycleMutationResponse"}
        "409": {description: Version, moderation, store, or completeness conflict.}
  /api/admin/catalog/v2/products/{product_id}/archive:
    post:
      tags: [catalog-studio-admin]
      summary: Archive a canonical product
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArchiveRequest"}
      responses:
        "200":
          description: Canonical product archived.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LifecycleMutationResponse"}
        "409": {description: Version or idempotency conflict.}
  /api/admin/catalog/workflows:
    post:
      tags: [catalog-studio-admin]
      summary: Start a sanitized OpenAI demo workflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogWorkflowStartRequest"
      responses:
        "201":
          description: Administrator-owned workflow with its initial business event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogWorkflowResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "409": {description: A linked draft, image job, or product does not exist.}
  /api/admin/catalog/workflows/{workflow_id}/events:
    post:
      tags: [catalog-studio-admin]
      summary: Append a sanitized, ordered OpenAI workflow event
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowEventInput"
      responses:
        "201":
          description: Sanitized event projection; exact client-event retries replay this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEventResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Run is missing or owned by another administrator.}
        "409": {description: Conflicting client event ID or invalid linked record.}
  /api/admin/catalog/workflows/{workflow_id}/draft-commands:
    post:
      tags: [catalog-studio-admin]
      summary: Generate or refine a moderated product draft
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogAICommandRequest"
      responses:
        "200":
          description: Moderation-approved private draft, or a safe blocked result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAIWorkflowResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Run or current draft not found.}
        "409": {description: Stale draft, idempotency conflict, or command already processing.}
        "502": {description: Moderation or structured Responses output failed.}
        "503": {description: Responses or catalog context is not configured.}
        "504": {description: Responses timed out.}
  /api/admin/catalog/workflows/{workflow_id}/realtime/sessions:
    post:
      tags: [catalog-studio-admin, realtime]
      summary: Create a workflow-bound Realtime voice session
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
      responses:
        "201":
          description: Short-lived client credential for a direct browser WebRTC connection.
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogRealtimeSessionResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow is missing or owned by another administrator.}
        "502": {description: Realtime returned an invalid response or failed.}
        "503": {description: Realtime is disabled, unconfigured, or temporarily unavailable.}
        "504": {description: Realtime session creation timed out.}
  /api/admin/catalog/workflows/{workflow_id}/realtime/tool-calls:
    post:
      tags: [catalog-studio-admin, realtime]
      summary: Execute an approved Realtime catalog draft tool call
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogRealtimeToolCallRequest"}
      responses:
        "200":
          description: Moderation-approved private draft, or a safe blocked result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogAIWorkflowResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or current draft not found.}
        "409": {description: Stale draft, idempotency conflict, or command already processing.}
        "422": {description: Tool name or arguments are not approved.}
        "502": {description: Moderation or structured Responses output failed.}
        "503": {description: Realtime, Responses, or catalog context is not configured.}
        "504": {description: Responses timed out.}
  /api/admin/catalog/workflows/{workflow_id}/image-commands:
    post:
      tags: [catalog-studio-admin, images]
      summary: Generate or refine an image for the current catalog draft
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogImageCommandRequest"}
      responses:
        "202":
          description: Durable image job queued for the current private draft.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageJobResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or current draft not found.}
        "409": {description: Stale draft, conflicting idempotency key, or invalid refinement source.}
  /api/admin/catalog/workflows/{workflow_id}/image-variant-sets:
    post:
      tags: [catalog-studio-admin, images]
      summary: Generate coherent images for the remaining catalog variants
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogImageVariantSetRequest"}
      responses:
        "202":
          description: Latest aggregate state and child jobs for the coordinated variant set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageVariantSetResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or current draft not found.}
        "409": {description: Stale draft or approved primary image is unavailable.}
        "422": {description: Draft does not declare a multi-variant family.}
  /api/admin/catalog/workflows/{workflow_id}/media-commands:
    post:
      tags: [catalog-studio-admin, images]
      summary: Create a product media variation from the approved core image
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogMediaCommandRequest"}
      responses:
        "202":
          description: Durable product media variation job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageJobResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or current draft not found.}
        "409": {description: Stale draft or approved core image unavailable.}
        "422": {description: Invalid media intent or parameters.}
  /api/admin/catalog/workflows/{workflow_id}/image-variant-sets/{image_variant_set_id}:
    get:
      tags: [catalog-studio-admin, images]
      summary: Read aggregate and child status for a catalog image variant set
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - {name: image_variant_set_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Latest aggregate state and child jobs for the coordinated variant set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageVariantSetResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or variant set not found.}
  /api/admin/catalog/workflows/{workflow_id}/image-jobs/{job_id}:
    get:
      tags: [catalog-studio-admin, images]
      summary: Read a Catalog Studio image job
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Current durable image job state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageJobResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow or image job not found.}
  /api/admin/catalog/workflows/{workflow_id}/image-jobs/{job_id}/approve:
    post:
      tags: [catalog-studio-admin, images]
      summary: Approve a generated image for catalog publication
      security:
        - bearerAuth: []
      parameters:
        - {name: workflow_id, in: path, required: true, schema: {type: string}}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogImageApprovalRequest"}
      responses:
        "200":
          description: Image marked approved in the current private draft.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImageApprovalResponse"}
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Valid Clerk user is not an administrator.}
        "404": {description: Workflow, draft, or image job not found.}
        "409": {description: Stale draft or image is no longer current.}
  /api/admin/catalog/workflows/{workflow_id}:
    get:
      tags: [catalog-studio-admin]
      summary: Read a business or developer demo timeline
      security:
        - bearerAuth: []
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: {type: string}
        - name: developer
          in: query
          description: Include sanitized developer fields; available only to the workflow owner.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Ordered business timeline with optional owner-only developer projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogWorkflowResponse"
        "401": {description: Missing or invalid Clerk token.}
        "403": {description: Developer view requested by a non-owner.}
        "404": {description: Run is missing or not shared with the caller.}
  /api/chat:
    post:
      tags: [chat]
      summary: Storefront chat
      description: >
        Stable retail chat endpoint for product questions, catalog search,
        related products, store contact information, approved service answers,
        and authenticated account/order/personal recommendation requests.
        Authentication is optional; sensitive requests are blocked unless the
        bearer token resolves to a linked customer.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              productQuestion:
                summary: Product page question
                value:
                  message: Is this jacket available?
                  context:
                    page_type: product
                    route: /product/cat_123
                    current_product:
                      id: cat_123
                    store_id: "1001"
              storePhone:
                summary: Open store contact question
                value:
                  message: What phone number can I call?
                  context:
                    store_id: "1001"
              orderStatus:
                summary: Authenticated order request
                value:
                  message: What is my order status?
                  context:
                    store_id: "1001"
      responses:
        "200":
          description: Chat assistant response. Sensitive requests may return route=blocked with sign-in/link actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          description: Invalid bearer token.
        "422":
          description: Invalid request shape.
  /api/catalog:
    get:
      tags: [catalog]
      summary: Catalog entry point
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Category navigation and product cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndexResponse"
  /api/categories:
    get:
      tags: [catalog]
      summary: Store-independent categories
      responses:
        "200":
          description: Available catalog categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/catalog/categories:
    get:
      tags: [catalog]
      summary: Store-independent categories alias
      responses:
        "200":
          description: Available catalog categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/stores/{store_id}/categories:
    get:
      tags: [catalog]
      summary: Store-scoped category availability
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Category counts scoped by store inventory.
          content:
