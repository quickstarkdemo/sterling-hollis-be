[project]
name = "sterling-hollis-be"
version = "0.1.0"
description = "Synthetic fashion data platform with FastAPI, Postgres, and Pinecone"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["urls"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "mcp[cli]>=1.0.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.22",
  "httpx>=0.27.2",
  "boto3>=1.35.0",
  "openai>=1.54.3",
  "pillow>=10.4.0",
  "pinecone>=5.4.0",
  "pyjwt[crypto]>=2.10.1",
  "strands-agents[openai]>=1.3.0",
  "ddtrace>=4.8.0",
  "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "ddtrace>=4.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
