      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    AdminLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
