x-datadog-env: &datadog-env
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-}
  DD_AGENT_HOST: ${DD_AGENT_HOST:-}
  DD_TRACE_AGENT_PORT: ${DD_TRACE_AGENT_PORT:-8126}
  DD_TRACE_AGENT_URL: ${DD_TRACE_AGENT_URL:-}
  DD_TRACE_REPORT_HOSTNAME: ${DD_TRACE_REPORT_HOSTNAME:-}
  DD_ENV: ${DD_ENV:-dev}
  DD_SERVICE: ${DD_SERVICE:-sterling-hollis-be}
  DD_VERSION: ${DD_VERSION:-}
  DD_MAIN_PACKAGE: ${DD_MAIN_PACKAGE:-app}
  DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
  DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}
  DD_SITE: ${DD_SITE:-datadoghq.com}
  DD_API_KEY: ${DD_API_KEY:-}
  DD_APP_KEY: ${DD_APP_KEY:-}
  DD_AI_GUARD_ENABLED: ${DD_AI_GUARD_ENABLED:-false}
  DD_AI_GUARD_ENDPOINT: ${DD_AI_GUARD_ENDPOINT:-}
  DD_AI_GUARD_DEMO_FALLBACK_ENABLED: ${DD_AI_GUARD_DEMO_FALLBACK_ENABLED:-false}
  DD_PROFILING_ENABLED: ${DD_PROFILING_ENABLED:-}
  DD_PROFILING_TIMELINE_ENABLED: ${DD_PROFILING_TIMELINE_ENABLED:-}
  DD_RUNTIME_METRICS_ENABLED: ${DD_RUNTIME_METRICS_ENABLED:-}
  DD_LLMOBS_ENABLED: ${DD_LLMOBS_ENABLED:-}
  STRANDS_OTEL_ENABLED: ${STRANDS_OTEL_ENABLED:-false}
  DD_LLMOBS_AGENTLESS_ENABLED: ${DD_LLMOBS_AGENTLESS_ENABLED:-}
  DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-sterling-hollis-be}
  DD_LOGS_INJECTION: ${DD_LOGS_INJECTION:-}
  DD_DATA_STREAMS_ENABLED: ${DD_DATA_STREAMS_ENABLED:-}
  DD_DBM_PROPAGATION_MODE: ${DD_DBM_PROPAGATION_MODE:-}
  DD_DYNAMIC_INSTRUMENTATION_ENABLED: ${DD_DYNAMIC_INSTRUMENTATION_ENABLED:-}
  DD_REMOTE_CONFIGURATION_ENABLED: ${DD_REMOTE_CONFIGURATION_ENABLED:-}
  DD_CODE_ORIGIN_FOR_SPANS_ENABLED: ${DD_CODE_ORIGIN_FOR_SPANS_ENABLED:-}
  DD_EXCEPTION_REPLAY_ENABLED: ${DD_EXCEPTION_REPLAY_ENABLED:-}
  DD_SYMBOL_DATABASE_UPLOAD_ENABLED: ${DD_SYMBOL_DATABASE_UPLOAD_ENABLED:-}
  DD_TRACE_OBFUSCATION_QUERY_EXEC_ENABLED: ${DD_TRACE_OBFUSCATION_QUERY_EXEC_ENABLED:-}
  DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: ${DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED:-}
  DD_DOGSTATSD_DISABLE: ${DD_DOGSTATSD_DISABLE:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sterling-hollis-be}
  OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-gen_ai_latest_experimental}
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-https://otlp.datadoghq.com/v1/traces}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      args:
        DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
        DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}
    command: ./scripts/run_api.sh
    environment:
      <<: *datadog-env
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/productdb
      DB_HOST: postgres
      DB_PORT: 5432
      UVICORN_RELOAD: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_ORCHESTRATION_MODE: ${CHAT_ORCHESTRATION_MODE:-deterministic}
      DEMO_OBSERVABILITY_ENABLED: ${DEMO_OBSERVABILITY_ENABLED:-false}
      DEMO_OBSERVABILITY_MODE: ${DEMO_OBSERVABILITY_MODE:-off}
      DEMO_OBSERVABILITY_LATENCY_SECONDS: ${DEMO_OBSERVABILITY_LATENCY_SECONDS:-8}
      DEMO_OBSERVABILITY_TARGET_STORE_ID: ${DEMO_OBSERVABILITY_TARGET_STORE_ID:-1001}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-fashion-products-v1}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      DATA_DIR: /app/data/runs
      EXEC_AUTO_OPTIMIZE_ENABLED: ${EXEC_AUTO_OPTIMIZE_ENABLED:-false}
      STRATEGY_PACKET_ENABLED: ${STRATEGY_PACKET_ENABLED:-false}
      MERCH_STRATEGY_CONTEXT_ENABLED: ${MERCH_STRATEGY_CONTEXT_ENABLED:-false}
      ASSOCIATE_PRIORITY_TAGS_ENABLED: ${ASSOCIATE_PRIORITY_TAGS_ENABLED:-false}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    depends_on:
      - postgres

  index-worker:
    build:
      context: .
      args:
        DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
        DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}
    command: ./scripts/run_index_worker.sh
    environment:
      <<: *datadog-env
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/productdb
      DB_HOST: postgres
      DB_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_OBSERVABILITY_ENABLED: ${DEMO_OBSERVABILITY_ENABLED:-false}
      DEMO_OBSERVABILITY_MODE: ${DEMO_OBSERVABILITY_MODE:-off}
      DEMO_OBSERVABILITY_LATENCY_SECONDS: ${DEMO_OBSERVABILITY_LATENCY_SECONDS:-8}
      DEMO_OBSERVABILITY_TARGET_STORE_ID: ${DEMO_OBSERVABILITY_TARGET_STORE_ID:-1001}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-fashion-products-v1}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      INDEX_WORKER_POLL_SECONDS: ${INDEX_WORKER_POLL_SECONDS:-2.0}
      DATA_DIR: /app/data/runs
      EXEC_AUTO_OPTIMIZE_ENABLED: ${EXEC_AUTO_OPTIMIZE_ENABLED:-false}
      STRATEGY_PACKET_ENABLED: ${STRATEGY_PACKET_ENABLED:-false}
      MERCH_STRATEGY_CONTEXT_ENABLED: ${MERCH_STRATEGY_CONTEXT_ENABLED:-false}
      ASSOCIATE_PRIORITY_TAGS_ENABLED: ${ASSOCIATE_PRIORITY_TAGS_ENABLED:-false}
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

volumes:
  pgdata:
