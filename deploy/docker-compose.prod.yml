services:
  api:
    image: ${PRODUCT_API_IMAGE}
    container_name: products-api
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./runtime.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - products_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  index-worker:
    image: ${PRODUCT_API_IMAGE}
    container_name: products-index-worker
    restart: unless-stopped
    pull_policy: always
    command: ./scripts/run_index_worker.sh
    env_file:
      - ./runtime.env
    volumes:
      - products_data:/app/data

volumes:
  products_data:
