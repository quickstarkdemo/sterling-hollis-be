services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: ./scripts/run_api.sh
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/productdb
      DB_HOST: postgres
      DB_PORT: 5432
      UVICORN_RELOAD: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-fashion-products-v1}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      DATA_DIR: /app/data/runs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - postgres

volumes:
  pgdata:
