services:
  api:
    image: ${PRODUCT_API_IMAGE}
    container_name: ${PRODUCT_API_CONTAINER_NAME:-sterling-hollis-be}
    restart: unless-stopped
    env_file:
      - ./runtime.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - products_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  index-worker:
    image: ${PRODUCT_API_IMAGE}
    container_name: ${PRODUCT_INDEX_WORKER_CONTAINER_NAME:-sterling-hollis-be-index-worker}
    restart: unless-stopped
    command: ./scripts/run_index_worker.sh
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./runtime.env
    volumes:
      - products_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  products_data:
    name: deploy_products_data
